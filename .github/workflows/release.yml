name: Build and release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: Verify signing and update manifests without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: ghostfile
env:
  ORIEL_REF: v0.9.0
  ZIG_VERSION: 0.16.0
  GHOSTFILE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
jobs:
  framework-ready:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.release.outputs.available }}
    steps:
      - name: Wait for the official Oriel release
        id: release
        working-directory: ${{ github.workspace }}
        run: |
          revision=$(git ls-remote https://github.com/highercomve/Oriel.git "refs/tags/$ORIEL_REF")
          if [ -n "$revision" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Oriel $ORIEL_REF is not published yet; platform builds are waiting." >> "$GITHUB_STEP_SUMMARY"
          fi
  linux:
    needs: framework-ready
    if: needs.framework-ready.outputs.available == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: System dependencies
        working-directory: ${{ github.workspace }}
        run: pacman -Syu --noconfirm --needed git openssh ca-certificates curl pkgconf gtk4 webkitgtk-6.0 wayland wayland-protocols libxkbcommon libxtst libx11 dbus ttf-dejavu python python-gobject python-pillow rust protobuf base-devel go squashfs-tools xorg-server-xvfb xdotool imagemagick
      - uses: actions/checkout@v4
        with:
          path: ghostfile
      - uses: actions/checkout@v4
        with:
          repository: highercomve/Oriel
          ref: ${{ env.ORIEL_REF }}
          path: oriel
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: python scripts/setup-oriel.py
      - name: Package tools
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
      - name: Rust and protocol tests
        run: cargo test --locked -p ghostfile-quickshare -p rqs_lib
      - name: Oriel packages (native UI)
        run: oriel package -Dnative_ui -Doptimize=ReleaseSafe
      - name: Encrypted transfer integration tests
        run: python tests/quickshare_loopback.py
      - name: Native desktop integration tests
        run: |
          mkdir -p artifacts
          bash tests/headless.sh python tests/desktop-integration.py
      - run: python scripts/collect-release.py linux-x86_64
      - name: Sign updater manifests
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.sign)
        env:
          ORIEL_UPDATE_KEY: ${{ secrets.ORIEL_UPDATE_KEY }}
        run: python scripts/sign-updates.py linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: ghostfile/dist/
          if-no-files-found: error
  macos:
    needs: framework-ready
    if: needs.framework-ready.outputs.available == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ghostfile
      - uses: actions/checkout@v4
        with:
          repository: highercomve/Oriel
          ref: ${{ env.ORIEL_REF }}
          path: oriel
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: brew install protobuf
      - run: python3 scripts/setup-oriel.py
      - name: Import persistent signing identity
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.sign)
        env:
          CERT: ${{ secrets.ORIEL_MACOS_CERT_P12_BASE64 }}
          ORIEL_MACOS_CERT_PASSWORD: ${{ secrets.ORIEL_MACOS_CERT_PASSWORD }}
        run: |
          test -n "$CERT" && test -n "$ORIEL_MACOS_CERT_PASSWORD"
          umask 077
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/ghostfile.p12"
          oriel signing import "$RUNNER_TEMP/ghostfile.p12" --password-env ORIEL_MACOS_CERT_PASSWORD
      - name: Tests
        run: cargo test --locked -p ghostfile-quickshare -p rqs_lib
      - name: Oriel packages
        env:
          ORIEL_MACOS_SIGN_IDENTITY: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.sign) && secrets.ORIEL_MACOS_SIGN_IDENTITY || '' }}
        run: oriel package -Dnative_ui -Doptimize=ReleaseSafe
      - name: Verify signed app
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.sign)
        run: codesign --verify --deep --strict zig-out/package/GhostFile.app
      - name: Remove imported keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ghostfile.p12"
          security delete-keychain oriel-signing.keychain-db || true
      - run: python3 scripts/collect-release.py macos-arm64
      - name: Sign updater manifests
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.sign)
        env:
          ORIEL_UPDATE_KEY: ${{ secrets.ORIEL_UPDATE_KEY }}
        run: python3 scripts/sign-updates.py macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ghostfile/dist/
          if-no-files-found: error
  windows:
    needs: framework-ready
    if: needs.framework-ready.outputs.available == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: ghostfile
    steps:
      - uses: actions/checkout@v4
        with:
          path: ghostfile
      - uses: actions/checkout@v4
        with:
          repository: highercomve/Oriel
          ref: ${{ env.ORIEL_REF }}
          path: oriel
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Dependencies
        run: |
          choco install protoc nsis mingw --no-progress -y
          rustup target add x86_64-pc-windows-gnu
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
      - run: python scripts/setup-oriel.py
      - name: Oriel packages
        run: oriel package -Dnative_ui -Doptimize=ReleaseSafe -Dtarget=x86_64-windows-gnu -Drust-target=x86_64-pc-windows-gnu
      - name: Sign app and installer
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.sign)
        env:
          ORIEL_WINDOWS_CERT_P12_BASE64: ${{ secrets.ORIEL_WINDOWS_CERT_P12_BASE64 }}
          ORIEL_WINDOWS_CERT_PASSWORD: ${{ secrets.ORIEL_WINDOWS_CERT_PASSWORD }}
        run: python scripts/sign-windows.py
      - run: python scripts/collect-release.py windows-x86_64
      - name: Sign updater manifests
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.sign)
        env:
          ORIEL_UPDATE_KEY: ${{ secrets.ORIEL_UPDATE_KEY }}
        run: python scripts/sign-updates.py windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ghostfile/dist/
          if-no-files-found: error
  android:
    needs: framework-ready
    if: needs.framework-ready.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ghostfile
      - uses: actions/checkout@v4
        with:
          repository: highercomve/Oriel
          ref: ${{ env.ORIEL_REF }}
          path: oriel
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: python3 scripts/setup-oriel.py
      - run: oriel android init
      - name: Signed APK and AAB
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.sign)
        env:
          KEYSTORE: ${{ secrets.ORIEL_ANDROID_KEYSTORE_BASE64 }}
          ORIEL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ORIEL_ANDROID_KEYSTORE_PASSWORD }}
          ORIEL_ANDROID_KEY_ALIAS: ${{ secrets.ORIEL_ANDROID_KEY_ALIAS }}
          ORIEL_ANDROID_KEY_PASSWORD: ${{ secrets.ORIEL_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$ORIEL_ANDROID_KEYSTORE_PASSWORD" && test -n "$ORIEL_ANDROID_KEY_ALIAS" && test -n "$ORIEL_ANDROID_KEY_PASSWORD"
          umask 077
          export ORIEL_ANDROID_KEYSTORE="$RUNNER_TEMP/ghostfile.keystore"
          trap 'rm -f "$ORIEL_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$ORIEL_ANDROID_KEYSTORE"
          oriel android build -Dnative_ui -Doptimize=ReleaseSafe
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
      - name: Unsigned CI APK and AAB
        if: ${{ !(startsWith(github.ref, 'refs/tags/') || inputs.sign) }}
        run: oriel android build -Dnative_ui -Doptimize=ReleaseSafe
      - run: python3 scripts/collect-release.py android
      - name: Sign updater manifests
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.sign)
        env:
          ORIEL_UPDATE_KEY: ${{ secrets.ORIEL_UPDATE_KEY }}
        run: python3 scripts/sign-updates.py android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ghostfile/dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.sign)
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: ghostfile
      - uses: actions/checkout@v4
        with:
          repository: highercomve/Oriel
          ref: ${{ env.ORIEL_REF }}
          path: oriel
      - uses: actions/download-artifact@v4
        with:
          path: ghostfile/dist
          merge-multiple: true
      - run: python3 scripts/combine-updates.py
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Verify every updater signature and payload
        run: zig build verify-updates -- dist src/update-public-key.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signed-update-feed
          path: ghostfile/dist/latest.json
      - name: Publish release packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "GhostFile $RELEASE_TAG"
